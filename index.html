<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Домашний хлеб — заказ в WhatsApp</title>
<style>
    * { box-sizing: border-box; }
  body { font-family: -apple-system, Arial, sans-serif; margin: 0; background: #fff8ee; color: #2b1d0e; }
  header { background: #8b4513; color: #fff; padding: 20px; text-align: center; }
  header h1 { margin: 0; font-size: 28px; }
  header p { margin: 6px 0 0; opacity: .9; }
  .wrap { max-width: 700px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.07); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .card h3 { margin: 0 0 4px; }
  .card p { margin: 0; color: #777; font-size: 14px; }
  .price { font-weight: 700; font-size: 18px; }
  .qty { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .qty button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #ddd; background: #fff; font-size: 20px; cursor: pointer; }
  .qty span { min-width: 20px; text-align: center; font-weight: 700; }
  input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; margin-bottom: 10px; }
  .btn { width: 100%; padding: 16px; border: 0; border-radius: 12px; background: #25D366; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: .6; }
  #status { text-align: center; margin-top: 12px; font-weight: 600; min-height: 24px; }
  .total { font-size: 20px; font-weight: 800; text-align: right; margin: 10px 0; }
</style>
</head>
<body>
<header>
  <h1>🍞 Домашний хлеб</h1>
  <p>Свежий хлеб с доставкой — заказ уходит в WhatsApp</p>
</header>

<div class="wrap">
  <div id="products"></div>

  <div class="total" id="total">Итого: 0 ₺</div>

  <h2>Ваши данные</h2>
  <input id="name" placeholder="Имя *" />
  <input id="phone" placeholder="Телефон *" />
  <input id="address" placeholder="Адрес доставки *" />
  <textarea id="comment" placeholder="Комментарий (необязательно)"></textarea>

  <button class="btn" id="orderBtn" onclick="sendOrder()">Заказать в WhatsApp</button>
  <div id="status"></div>
</div>

<script>
const PRODUCTS = [
  { name: "Белый хлеб", price: 80, desc: "Классический, 500 г" },
  { name: "Ржаной хлеб", price: 90, desc: "На закваске, 500 г" },
  { name: "Багет", price: 70, desc: "Хрустящий, 300 г" },
  { name: "Лепёшка", price: 60, desc: "Мягкая, 300 г" },
];

let cart = {};

function render() {
  const el = document.getElementById('products');
  el.innerHTML = PRODUCTS.map((p, i) => `
    <div class="card">
      <div>
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <div class="qty">
          <button onclick="changeQty(${i}, -1)">−</button>
          <span>${cart[i] || 0}</span>
          <button onclick="changeQty(${i}, 1)">+</button>
        </div>
      </div>
      <div class="price">${p.price} ₺</div>
    </div>
  `).join('');
  updateTotal();
}

function changeQty(i, d) {
  cart[i] = Math.max(0, (cart[i] || 0) + d);
  if (cart[i] === 0) delete cart[i];
  render();
}

function updateTotal() {
  let total = 0;
  for (let i in cart) total += PRODUCTS[i].price * cart[i];
  document.getElementById('total').textContent = 'Итого: ' + total + ' ₺';
  return total;
}

async function sendOrder() {
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const address = document.getElementById('address').value.trim();
  const comment = document.getElementById('comment').value.trim();
  const total = updateTotal();

  const items = Object.keys(cart).map(i => ({
    name: PRODUCTS[i].name,
    qty: cart[i],
    price: PRODUCTS[i].price
  }));

  const status = document.getElementById('status');
  const btn = document.getElementById('orderBtn');

  if (!name || !phone || !address) {
    status.textContent = '⚠️ Заполните имя, телефон и адрес';
    status.style.color = 'red';
    return;
  }
  if (items.length === 0) {
    status.textContent = '⚠️ Корзина пустая — выберите хлеб';
    status.style.color = 'red';
    return;
  }

  btn.disabled = true;
  status.textContent = 'Отправляем заказ...';
  status.style.color = '#555';

  try {
    const r = await fetch('/api/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone, address, items, total, comment })
    });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || 'Ошибка сервера');

    status.textContent = '✅ Заказ отправлен! Спасибо! Мы напишем вам в WhatsApp.';
    status.style.color = 'green';
    cart = {};
    render();
  } catch (e) {
    status.textContent = '❌ Ошибка: ' + e.message;
    status.style.color = 'red';
  } finally {
    btn.disabled = false;
  }
}

render();
</script>
</body>
</html>
