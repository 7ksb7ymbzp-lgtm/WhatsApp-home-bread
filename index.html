                if (pCat(p) !== currentCategory) { if (currentCategory !== "") html += `</div>`; currentCategory = pCat(p); html += `<div class="category-title">${escapeHtml(currentCategory)}</div><div class="catalog-grid">`; }
                const key = p.name_en; const count = cart[key] ? cart[key].count : 0;
                html += `<div class="card"><img src="${escapeHtml(p.img)}" class="card-img" alt="${escapeHtml(pName(p))}"><div><div class="card-title">${escapeHtml(pName(p))}</div><div class="card-desc">${escapeHtml(pDesc(p))}</div></div><div class="card-footer"><div class="price-weight"><div class="card-price">${p.price} ₺</div><div class="card-weight">${escapeHtml(p.weight)}</div></div><div>${count === 0 ? `<button class="btn-action" onclick="changeQty(${originalIndex}, 1)">${t.add}</button>` : `<div class="counter-row"><button class="round-btn" onclick="changeQty(${originalIndex}, -1)">-</button><span class="counter-value">${count}</span><button class="round-btn" onclick="changeQty(${originalIndex}, 1)">+</button></div>`}</div></div></div></div>`;
            });
            if (currentCategory !== "") html += `</div>`; container.innerHTML = html;
        }
        function toggleSearchPopup() { const popup = document.getElementById("searchPopup"); const searchMainBtn = document.getElementById("searchMainBtn"); const searchCloseBtn = document.getElementById("searchCloseBtn"); if (popup.style.display === "flex") { popup.style.display = "none"; } else { popup.style.display = "flex"; document.getElementById("searchInput").focus(); if (document.getElementById("searchInput").value.trim().length > 0) { searchMainBtn.style.display = "none"; searchCloseBtn.style.display = "flex"; } } }
        function handleSearch() { const input = document.getElementById("searchInput"); searchQuery = input.value.trim().toLowerCase(); const suggestionsBox = document.getElementById("searchSuggestions"); const searchMainBtn = document.getElementById("searchMainBtn"); const searchCloseBtn = document.getElementById("searchCloseBtn"); renderCatalog(); if (searchQuery.length > 0) { searchMainBtn.style.display = "none"; searchCloseBtn.style.display = "flex"; const matches = products.filter(p => pName(p).toLowerCase().includes(searchQuery) || pDesc(p).toLowerCase().includes(searchQuery)); if (matches.length > 0) { let suggestHtml = ""; matches.slice(0, 5).forEach(m => { const originalIndex = products.findIndex(item => item === m); suggestHtml += `<div class="suggestion-item" onclick="selectSuggestion(${originalIndex})"><img src="${escapeHtml(m.img)}" class="suggestion-img"><div><span style="font-size:15px; font-weight:600; color:#fff;">${escapeHtml(pName(m))}</span><br><span style="font-size:14px; color:#ffcc99;">${m.price} ₺</span></div></div>`; }); suggestionsBox.innerHTML = suggestHtml; suggestionsBox.style.display = "flex"; } else { suggestionsBox.innerHTML = `<div style="padding:10px; font-size:14px; color:#d1c7bd; text-align:center;">${T[currentLang].notFound}</div>`; suggestionsBox.style.display = "flex"; } } else { searchMainBtn.style.display = "flex"; searchCloseBtn.style.display = "none"; suggestionsBox.innerHTML = ""; suggestionsBox.style.display = "none"; } }
        function closeSearch() { document.getElementById("searchInput").value = ""; searchQuery = ""; document.getElementById("searchPopup").style.display = "none"; document.getElementById("searchSuggestions").style.display = "none"; document.getElementById("searchMainBtn").style.display = "flex"; document.getElementById("searchCloseBtn").style.display = "none"; renderCatalog(); }
        function selectSuggestion(index) { const product = products[index]; document.getElementById("searchInput").value = pName(product); searchQuery = pName(product).toLowerCase(); document.getElementById("searchPopup").style.display = "none"; document.getElementById("searchSuggestions").style.display = "none"; renderCatalog(); }
        function changeQty(index, delta) { const product = products[index]; const key = product.name_en; if (!cart[key]) { cart[key] = { count: 0, price: product.price }; } cart[key].count += delta; if (cart[key].count < 0) { cart[key].count = 0; } renderCatalog(); updateCartState(); }
        function updateCartState() { const t = T[currentLang]; let totalCount = 0; let totalSum = 0; let modalListHtml = ""; for (const key in cart) { if (cart[key].count > 0) { const product = products.find(p => p.name_en === key); const displayName = product ? pName(product) : key; const count = cart[key].count; const sum = count * cart[key].price; totalCount += count; totalSum += sum; modalListHtml += `<div class="cart-item-row"><span><b>${escapeHtml(displayName)}</b></span><div style="display: flex; align-items: center; gap: 12px;"><div class="counter-row" style="padding: 4px 8px;"><button class="round-btn" onclick="updateCartQty('${escapeHtml(key)}', -1)">-</button><span class="counter-value" style="margin: 0 8px; font-size:17px;">${count}</span><button class="round-btn" onclick="updateCartQty('${escapeHtml(key)}', 1)">+</button></div><span style="color: #ffcc99; width: 70px; text-align: right; font-weight:700;">${sum} ₺</span></div></div>`; } } const cartBar = document.getElementById("cart-bar"); if (totalCount > 0) { document.getElementById("cart-count").innerText = totalCount; document.getElementById("cart-total").innerText = totalSum + " ₺"; document.getElementById("cart-items-list").innerHTML = modalListHtml; document.getElementById("modal-total-price").innerText = `${t.total}${totalSum} ₺`; cartBar.style.display = "flex"; } else { cartBar.style.display = "none"; toggleModal(false); } }
        function updateCartQty(key, delta) { if (cart[key]) { cart[key].count += delta; if (cart[key].count <= 0) delete cart[key]; renderCatalog(); updateCartState(); } }
        async function sendOrderToWhatsApp() { const t = T[currentLang]; let totalCount = 0; let totalSum = 0; const orderLines = []; for (const key in cart) { if (cart[key].count > 0) { const product = products.find(p => p.name_en === key); const displayName = product ? pName(product) : key; const count = cart[key].count; const sum = count * cart[key].price; totalCount += count; totalSum += sum; orderLines.push(`• ${displayName} x ${count} ${t.pcsShort} — ${sum} ₺`); } } if (totalCount === 0) { alert(t.empty); return; } const comment = document.getElementById("order-comment").value.trim(); let orderText = `${t.orderTitle}\n\n`; orderText += orderLines.join("\n"); orderText += `\n\n${t.totalLine}${totalSum} ₺`; if (comment !== "") { orderText += `\n${t.commentLine}${comment}`; } const btn = document.querySelector(".modal-checkout-btn"); const oldText = btn ? btn.innerText : ""; if (btn) { btn.innerText = t.sending; btn.disabled = true; } try { let res = await fetch("/api/send-order", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: orderText }) }); if (res.status === 404) { res = await fetch("/api/send-order.js", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: orderText }) }); } const data = await res.json().catch(() => ({})); if (res.ok && data.ok) { alert(t.sent); cart = {}; document.getElementById("order-comment").value = ""; renderCatalog(); updateCartState(); toggleModal(false); } else { alert(t.err + (data.error || res.status)); } } catch(e) { alert(t.noConn); } if (btn) { btn.innerText = oldText; btn.disabled = false; } }
        function toggleModal(show) { const modal = document.getElementById("cart-modal"); if (modal) { modal.style.display = show ? "flex" : "none"; } }
        setLang(currentLang);
    </script>
