<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Bread - Homemade sourdough bread</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#1a1a1a;color:#fff}
header{position:sticky;top:0;background:#111;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.lang{display:flex;gap:6px}
.lang button{background:#333;color:#fff;border:1px solid #555;padding:6px 12px;border-radius:20px;cursor:pointer}
.lang button.active{background:#22c55e;border-color:#22c55e;color:#000;font-weight:700}
h1{font-size:20px;margin:16px} .sub{color:#aaa;margin:0 16px 16px}
.search{margin:0 16px 16px}.search input{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 120px}
.card{background:#222;border-radius:16px;overflow:hidden}
.card img{width:100%;height:140px;object-fit:cover}
.card b{display:block;padding:8px 10px 0}.card p{margin:4px 10px;color:#aaa;font-size:13px;min-height:36px}
.price-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 10px}
.add{background:#22c55e;border:0;padding:8px 14px;border-radius:20px;font-weight:700;cursor:pointer}
.cat{grid-column:1/-1;font-size:19px;font-weight:800;margin:14px 0 2px}
.cart{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;padding:12px 16px}
.cart button{width:100%;background:#22c55e;border:0;padding:14px;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;overflow:auto}
.modal>div{background:#1a1a1a;margin:20px auto;max-width:480px;padding:20px;border-radius:16px}
input,textarea{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;font-size:16px}
label{font-size:14px;color:#ddd}
.close{float:right;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
</style>
</head>
<body>
<header>
<div><b>🍞 Home Bread</b></div>
<div class="lang"><button id="btn-en" onclick="setLang('en')">EN</button><button id="btn-de" onclick="setLang('de')">DE</button></div>
</header>
<h1 id="t-title">Homemade bread on sourdough</h1>
<p class="sub" id="t-sub">Fresh from the oven • Gazipasa • Order for tomorrow</p>
<div class="search"><input id="search" placeholder="Search..."></div>
<div class="grid" id="grid"></div>
<div class="cart"><div id="t-total" style="margin-bottom:8px">Total: 0 ₺</div><button id="t-checkout" onclick="openCart()">View cart & order</button></div>

<div class="modal" id="modal"><div>
<button class="close" onclick="closeCart()">×</button>
<h2 id="t-your-order">Your order</h2>
<div id="cart-items"></div>
<label id="t-name">Your name *</label><input id="name" placeholder="Anna">
<label id="t-phone">Phone *</label><input id="phone" placeholder="+90...">
<label id="t-address">Address *</label><input id="address" placeholder="Street, house, apartment">
<label id="t-comment">Order comment (allergy, wishes)</label><textarea id="comment" placeholder="e.g. allergy to carrots..."></textarea>
<div id="t-total2" style="font-weight:800;margin:10px 0">Total to pay: 0 ₺</div>
<button id="t-send" onclick="sendOrder()" style="width:100%;background:#22c55e;border:0;padding:14px;border-radius:12px;font-weight:800;font-size:16px">Send order</button>
<div id="msg" style="margin-top:10px;color:#f87171"></div>
</div></div>

<script src="products.js"></script>
<script>
const T={
en:{title:"Homemade bread on sourdough",sub:"Fresh from the oven • Gazipasa • Order for tomorrow",search:"Search...",total:"Total: ",checkout:"View cart & order",yourOrder:"Your order",name:"Your name *",phone:"Phone *",address:"Address *",comment:"Order comment (allergy, wishes)",commentPh:"e.g. allergy to carrots...",total2:"Total to pay: ",send:"Send order",add:"Add",empty:"Cart is empty",fill:"Please fill in name, phone and address",error:"Send error, please try again",ok:"Order sent! Thank you!"},
de:{title:"Hausgemachtes Brot mit Sauerteig",sub:"Frisch aus dem Ofen • Gazipasa • Bestellung für morgen",search:"Suche...",total:"Gesamt: ",checkout:"Warenkorb & bestellen",yourOrder:"Ihre Bestellung",name:"Ihr Name *",phone:"Telefon *",address:"Adresse *",comment:"Kommentar zur Bestellung (Allergie, Wünsche)",commentPh:"z.B. Allergie gegen Karotten...",total2:"Zu zahlen: ",send:"Bestellung senden",add:"Hinzufügen",empty:"Warenkorb ist leer",fill:"Bitte Name, Telefon und Adresse ausfüllen",error:"Sendefehler, bitte erneut versuchen",ok:"Bestellung gesendet! Danke!"}
};
let lang=localStorage.getItem('lang')||'en';
let cart={};
const products=window.PRODUCTS||[];
function setLang(l){lang=l;localStorage.setItem('lang',l);applyLang();render();}
function applyLang(){
const t=T[lang];
document.getElementById('t-title').textContent=t.title;
document.getElementById('t-sub').textContent=t.sub;
document.getElementById('search').placeholder=t.search;
document.getElementById('t-checkout').textContent=t.checkout;
document.getElementById('t-your-order').textContent=t.yourOrder;
document.getElementById('t-name').textContent=t.name;
document.getElementById('t-phone').textContent=t.phone;
document.getElementById('t-address').textContent=t.address;
document.getElementById('t-comment').textContent=t.comment;
document.getElementById('comment').placeholder=t.commentPh;
document.getElementById('t-send').textContent=t.send;
document.getElementById('btn-en').className=lang==='en'?'active':'';
document.getElementById('btn-de').className=lang==='de'?'active':'';
updateTotal();
}
function render(){
const q=(document.getElementById('search').value||'').toLowerCase();
const grid=document.getElementById('grid');grid.innerHTML='';
let lastCat='';
products.forEach((p,i)=>{
const name=lang==='de'?p.name_de:p.name_en;
const desc=lang==='de'?p.desc_de:p.desc_en;
const cat=lang==='de'?p.category_de:p.category_en;
if(!name.toLowerCase().includes(q)&&!desc.toLowerCase().includes(q))return;
if(cat!==lastCat){lastCat=cat;const d=document.createElement('div');d.className='cat';d.textContent=cat;grid.appendChild(d);}
const c=document.createElement('div');c.className='card';
c.innerHTML=`<img src="${p.img}"><b>${name}</b><p>${desc} • ${p.weight}</p><div class="price-row"><span>${p.price} ₺</span><button class="add" onclick="add(${i})">${T[lang].add}</button></div>`;
grid.appendChild(c);
});
}
function add(i){cart[i]=(cart[i]||0)+1;updateTotal();}
function updateTotal(){
let s=0;for(let k in cart)s+=products[k].price*cart[k];
document.getElementById('t-total').textContent=T[lang].total+s+' ₺';
document.getElementById('t-total2').textContent=T[lang].total2+s+' ₺';
}
function openCart(){
const el=document.getElementById('cart-items');el.innerHTML='';
let has=false;for(let k in cart){has=true;const p=products[k];const name=lang==='de'?p.name_de:p.name_en;el.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #333"><span>${name} × ${cart[k]}</span><span>${p.price*cart[k]} ₺</span></div>`;}
if(!has)el.innerHTML=T[lang].empty;
updateTotal();document.getElementById('modal').style.display='block';
}
function closeCart(){document.getElementById('modal').style.display='none';}
async function sendOrder(){
const name=document.getElementById('name').value.trim();
const phone=document.getElementById('phone').value.trim();
const address=document.getElementById('address').value.trim();
const comment=document.getElementById('comment').value.trim();
if(!name||!phone||!address||Object.keys(cart).length===0){document.getElementById('msg').textContent=T[lang].fill;return;}
let items=[];for(let k in cart){const p=products[k];items.push({name:lang==='de'?p.name_de:p.name_en,qty:cart[k],price:p.price});}
try{
const r=await fetch('/api/send-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,address,comment,items,lang})});
if(!r.ok)throw new Error('fail');
cart={};updateTotal();closeCart();alert(T[lang].ok);
}catch(e){document.getElementById('msg').textContent=T[lang].error;}
}
document.getElementById('search').addEventListener('input',render);
applyLang();render();
</script>
</body>
</html>
